name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - Asli
      - main
      - dev
    tags:
      - "is.*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, vet and guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Environment naming guard
        run: go test ./internal/platform/envguard/

      - name: Validate installer shell scripts
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash -n scripts/manage.sh

  release:
    name: Attach binary to the is.* release
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/is.')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o release-assets/gamaj-bot-linux-amd64 ./cmd/gamajbot
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o release-assets/gamaj-bot-linux-arm64 ./cmd/gamajbot

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for file in gamaj-*; do
            [[ "$file" == *.sha256 ]] || sha256sum "$file" > "${file}.sha256"
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          gh release view "$release_tag" >/dev/null 2>&1 || \
            gh release create "$release_tag" --title "$release_tag" --notes "Gamaj Bot ${release_tag}"
          gh release upload "$release_tag" release-assets/gamaj-* --clobber
