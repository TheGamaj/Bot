name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - Asli
    tags:
      - "is.*"
  pull_request:
    branches:
      - Asli

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, vet and guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Includes the environment naming guard. Running the whole suite matters:
      # the bot panel was once written, embedded and guarded while nothing
      # imported it, and no step here would have noticed.
      - name: Test
        run: |
          set -euo pipefail
          go test ./internal/platform/envguard/ -v
          go test ./internal/platform/routeguard/ -v
          go test ./internal/botpanel/ -v
          go test ./internal/panel/ -v

      - name: Validate installer shell scripts
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash -n scripts/manage.sh
          bash -n scripts/tests/e2e-bot-install.sh
          bash -n scripts/tests/e2e-webhook.sh

  install-e2e:
    name: Install on a fresh runner and check the systemd unit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run bot install end-to-end test
        run: sudo env "PATH=$PATH" bash scripts/tests/e2e-bot-install.sh

  # The Gamaj Bot and the Gamaj Node are separate repositories, so this job
  # checks both out side by side: the bot is the checkout at the workspace
  # root, the node lands in node-repo and is handed to the test through
  # GAMAJ_E2E_NODE_REPO. The test starts the node as a systemd service with a
  # stub xray core, points the bot at a mock Panel that records every API call,
  # and proves a real Telegram webhook update is accepted and answered with a
  # Panel API call.
  webhook-e2e:
    name: Run the bot webhook against a real Node
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Gamaj Bot
        uses: actions/checkout@v4

      - name: Checkout Gamaj Node
        uses: actions/checkout@v4
        with:
          repository: TheGamaj/Node
          ref: Asli
          path: node-repo

      # The node requires the newer toolchain of the two, and the bot builds
      # with it as well, so one setup covers both checkouts.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "node-repo/go.mod"

      - name: Run the bot webhook + node end-to-end test
        env:
          GAMAJ_E2E_PREFIX: /tmp/gamaj-bot-node-e2e
          GAMAJ_E2E_NODE_REPO: ${{ github.workspace }}/node-repo
          GAMAJ_E2E_WAIT_SECONDS: "120"
        run: >
          sudo env "PATH=$PATH"
          GAMAJ_E2E_PREFIX="$GAMAJ_E2E_PREFIX"
          GAMAJ_E2E_NODE_REPO="$GAMAJ_E2E_NODE_REPO"
          GAMAJ_E2E_WAIT_SECONDS="$GAMAJ_E2E_WAIT_SECONDS"
          bash scripts/tests/e2e-webhook.sh

  release:
    name: Attach binary to the is.* release
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/is.')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o release-assets/gamaj-bot-linux-amd64 ./cmd/gamajbot
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o release-assets/gamaj-bot-linux-arm64 ./cmd/gamajbot

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for file in gamaj-*; do
            [[ "$file" == *.sha256 ]] || sha256sum "$file" > "${file}.sha256"
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          gh release view "$release_tag" >/dev/null 2>&1 || \
            gh release create "$release_tag" --title "$release_tag" --notes "Gamaj Bot ${release_tag}"
          gh release upload "$release_tag" release-assets/gamaj-* --clobber
