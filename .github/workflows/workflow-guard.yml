name: Workflow Guard

on:
  workflow_dispatch:
  push:
    branches:
      - Asli
  pull_request:
    branches:
      - Asli

permissions:
  contents: read

concurrency:
  group: workflow-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Reference, branch and brand guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run workflow guard
        run: bash scripts/ci/workflow-guard.sh
