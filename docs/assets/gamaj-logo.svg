<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gamaj">
  <!-- Gamaj mark: a squared-off G cut out of a solid app tile. -->
  <defs>
    <mask id="gamaj-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <g fill="none" stroke="#000000" stroke-width="60" stroke-linecap="square">
        <path d="M324.9 161.7 A112 112 0 1 0 368 250"/>
        <path d="M368 250 H 288"/>
      </g>
    </mask>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="128" fill="#0B0B0F" mask="url(#gamaj-cut)"/>
</svg>
