<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gamaj Bot | گمج</title>
<!-- No favicon link: /statics is served by the Panel, not by the bot, so this
     pointed at a 404 on the Mini App's own origin. -->
<style>
:root{--bg:#000;--fg:#fff;--muted:rgba(255,255,255,.55);--line:rgba(255,255,255,.14);--card:#0a0a0a;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Vazirmatn,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;padding:16px;padding-bottom:32px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
.logo svg{height:44px;width:auto}
.logo h1{font-size:1.15rem;font-weight:700;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h2{font-size:1rem;margin-bottom:6px}
.card p{color:var(--muted);font-size:.85rem;line-height:1.7}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.row:last-child{border-bottom:none}
.row .k{color:var(--muted)}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:12px;background:var(--fg);color:var(--bg);font-size:.95rem;font-weight:700;cursor:pointer;margin-top:10px}
.btn:active{opacity:.85}
.status{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.75rem}
.muted{color:var(--muted)}
.links a{display:block;color:var(--fg);word-break:break-all;font-size:.8rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.links a:last-child{border-bottom:none}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:20px;line-height:1.7}
</style>
</head>
<body>
<div class="logo">
<!-- The Gamaj lockup, drawn inline. The previous <img src="/statics/gamaj-logo.svg">
     pointed at a path the bot does not serve, and the onerror handler hid the
     broken image, so this header never showed a logo at all. Inline also means
     currentColor follows the theme instead of resolving to black. -->
<svg viewBox="0 0 220 64" height="44" fill="currentColor" role="img" aria-label="Gamaj"><path d="M0 8h20v20H0V8zm28 0h20v20H28V8zM0 36h20v20H0V36zm28 8h12v12H28V44z"/><text x="76" y="43" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="600" letter-spacing="3.5" fill="currentColor">GAMAJ</text></svg>
<h1>Gamaj | گمج</h1>
</div>
<div id="app">
<div class="card"><h2>در حال بارگذاری…</h2><p id="err" class="muted"></p></div>
</div>
<footer><div class="muted">Gamaj Bot Mini App is.0.0.1</div><div>Coded by AsliCode</div></footer>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  function init(){ if(tg){ tg.ready(); tg.expand(); } load(); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function fmtBytes(n){ n=Number(n)||0; if(!n) return 'نامحدود'; var u=['B','KB','MB','GB','TB'],i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(i?1:0)+' '+u[i]; }
  function fmtExpire(ts){ if(!ts) return 'نامحدود'; var d=new Date(ts*1000); return d.toLocaleDateString('fa-IR'); }
  function load(){
    // The Mini App receives all data through the bot's Gamaj API using the
    // initData validated server-side; this page is rendered with the data
    // embedded by the Gamaj Bot process.
    var data = window.__GAMAJ_MINIAPP__ || {};
    render(data);
  }
  function render(d){
    var app=document.getElementById('app'); app.innerHTML='';
    if(d.error){ app.innerHTML='<div class="card"><h2>خطا</h2><p class="muted">'+esc(d.error)+'</p></div>'; return; }
    if(d.service){
      var s=d.service;
      var html='<div class="card"><h2>سرویس شما</h2>'
        +'<div class="row"><span class="k">نام کاربری</span><span>'+esc(s.username)+'</span></div>'
        +'<div class="row"><span class="k">وضعیت</span><span class="status">'+esc(s.status)+'</span></div>'
        +'<div class="row"><span class="k">حجم مصرفی</span><span>'+fmtBytes(s.used_traffic)+' / '+fmtBytes(s.data_limit)+'</span></div>'
        +'<div class="row"><span class="k">انقضا</span><span>'+fmtExpire(s.expire)+'</span></div>'
        +'</div>';
      if(s.subscription_url){
        html+='<div class="card links"><h2>لینک اشتراک</h2><a href="'+esc(s.subscription_url)+'">'+esc(s.subscription_url)+'</a></div>';
      }
      if(s.links&&s.links.length){
        html+='<div class="card links"><h2>کانفیگ‌ها</h2>';
        s.links.forEach(function(l){ html+='<a href="'+esc(l)+'">'+esc(l)+'</a>'; });
        html+='</div>';
      }
      app.innerHTML=html;
      return;
    }
    app.innerHTML='<div class="card"><h2>خوش آمدید</h2><p class="muted">برای خرید و مدیریت سرویس، از دکمه‌های ربات استفاده کنید.</p></div>';
  }
  if(tg){ tg.ready(); }
  init();
})();
</script>
</body>
</html>
